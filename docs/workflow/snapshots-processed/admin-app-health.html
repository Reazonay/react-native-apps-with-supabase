<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin App - Health</title>
    <style>
      :root {
        --kinetic-background: #141408;
        --kinetic-surface: #212013;
        --kinetic-surface-variant: #363527;
        --kinetic-outline: #949277;
        --kinetic-on-surface: #e6e3ce;
        --kinetic-primary: #ede900;
        --kinetic-error: #ffb4ab;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #fffaf2;
        color: #111827;
      }

      .page {
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        max-width: 820px;
      }

      .nav-row {
        display: flex;
        gap: 12px;
      }

      .nav-button {
        border-radius: 999px;
        border: 1px solid #d1d5db;
        padding: 10px 16px;
        background: #ffffff;
        font-weight: 600;
        color: #374151;
      }

      .nav-button.active {
        background: #111827;
        border-color: #111827;
        color: #ffffff;
      }

      .card {
        max-width: 720px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: #ffffff;
        border-radius: 20px;
        padding: 24px;
        border: 1px solid #e5e7eb;
      }

      .heading {
        font-size: 34px;
        font-weight: 700;
        color: #111827;
        margin: 0;
      }

      .subheading {
        font-size: 16px;
        line-height: 24px;
        color: #4b5563;
        margin: 0;
      }

      .label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #6b7280;
        font-weight: 700;
      }

      .endpoint {
        font-size: 14px;
        color: #111827;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .status-pill {
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 700;
        background: #e5e7eb;
        color: #374151;
      }

      .status-loading {
        background: #fef3c7;
        color: #92400e;
      }

      .health-message {
        font-size: 14px;
        color: #1f2937;
      }

      .health-button {
        background: #0f766e;
        color: #ecfeff;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        display: inline-block;
        width: fit-content;
      }
    </style>
  </head>
  <body>
    <main data-cdd-id="tpl-page-templat-01" class="page">
      <nav data-cdd-id="mol-navigation-p-01" class="nav-row">
        <span data-cdd-id="atm-nav-button-02" class="nav-button">Dashboard</span>
        <span data-cdd-id="atm-nav-button-01" class="nav-button active">Health</span>
      </nav>

      <section data-cdd-id="org-card-01" class="card">
        <h1 data-cdd-id="atm-heading-01" class="heading">Health Page</h1>
        <p data-cdd-id="atm-body-text-01" class="subheading">Prueft die Erreichbarkeit der Supabase Edge Function vom Admin-Client.</p>
        <div data-cdd-id="atm-unknown-01">
          <div data-cdd-id="atm-label-caps-01" class="label">Endpoint</div>
          <div data-cdd-id="atm-body-text-02" class="endpoint">Nicht konfiguriert</div>
        </div>
        <div data-cdd-id="mol-health-statu-01" class="status-row">
          <div data-cdd-id="atm-label-caps-01" class="label">Status</div>
          <div data-cdd-id="atm-status-pill-01" class="status-pill status-loading">LOADING</div>
        </div>
        <div data-cdd-id="atm-body-text-03" class="health-message">Verbindung wird geprueft...</div>
        <div data-cdd-id="atm-action-butto-01" class="health-button">Health-Check ausfuehren</div>
      </section>
    </main>
  </body>
</html>
