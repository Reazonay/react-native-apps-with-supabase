<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>FORGE - Dashboard</title>
  <style>
    :root {
      --bg-color: #0a0a05;
      --surface: #11110a;
      --surface-variant: #1a1a0f;
      --border: #333322;
      --primary: #ede900;
      --text-main: #ffffff;
      --text-muted: #a8a892;
      --danger: #ff5544;
      --success: #88d982;
      --success-bg: #005b14;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* --- Header --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 12px 24px;
      background: rgba(10, 10, 5, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      position: sticky;
      top: 0;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -1px;
      text-shadow: 0 0 10px rgba(237, 233, 0, 0.4);
    }

    .profile-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-variant);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--primary);
    }

    /* --- Main Content --- */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      padding-bottom: 100px; /* Space for navbar */
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px 0;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 24px 0;
      line-height: 1.5;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(237,233,0,0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Workout List */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .workout-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .workout-card:active {
      transform: scale(0.98);
      background: var(--surface-variant);
    }

    .workout-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    .workout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .workout-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .badge {
      background: var(--success-bg);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .badge.beginner {
      background: rgba(164, 201, 255, 0.15);
      color: #a4c9ff;
    }

    .workout-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* --- Bottom Navigation --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: rgba(10, 10, 5, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 20px; /* Safe area inset */
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .nav-item.active .nav-icon {
      fill: rgba(237, 233, 0, 0.2);
    }

    .nav-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">FORGE</div>
    <div class="profile-avatar">U</div>
  </header>

  <main>
    <h1>Welcome back, Athlete</h1>
    <p class="subtitle">Dein Dashboard. Bereit für das nächste Workout?</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">12</div>
        <div class="stat-label">Workouts</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">340</div>
        <div class="stat-label">Minuten</div>
      </div>
    </div>

    <div class="section-title">Dein Plan</div>

    <div class="workout-card" onclick="window.parent.loadFrame('workout-app-health.html', null)">
      <div class="workout-header">
        <h2 class="workout-title">Lower Body Strength</h2>
        <span class="badge">Intermediate</span>
      </div>
      <div class="workout-meta">
        <span>⏱️ 45 MIN</span>
        <span>🔥 320 KCAL</span>
      </div>
    </div>

    <div class="workout-card">
      <div class="workout-header">
        <h2 class="workout-title">Core Stability Circuit</h2>
        <span class="badge beginner">Beginner</span>
      </div>
      <div class="workout-meta">
        <span>⏱️ 20 MIN</span>
        <span>🔥 150 KCAL</span>
      </div>
    </div>
    
    <div class="workout-card">
      <div class="workout-header">
        <h2 class="workout-title">Full Body HIIT</h2>
        <span class="badge">Advanced</span>
      </div>
      <div class="workout-meta">
        <span>⏱️ 30 MIN</span>
        <span>🔥 400 KCAL</span>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="workout-app-dashboard.html" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="9" rx="1"></rect>
        <rect x="14" y="3" width="7" height="5" rx="1"></rect>
        <rect x="14" y="12" width="7" height="9" rx="1"></rect>
        <rect x="3" y="16" width="7" height="5" rx="1"></rect>
      </svg>
      <span class="nav-label">HOME</span>
    </a>
    <a href="workout-app-health.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </svg>
      <span class="nav-label">HEALTH</span>
    </a>
    <a href="#" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span class="nav-label">PROFILE</span>
    </a>
  </nav>

</body>
</html>
