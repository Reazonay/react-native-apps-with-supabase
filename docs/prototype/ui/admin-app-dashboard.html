<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>FORGE Admin - Dashboard</title>
  <style>
    :root {
      --bg-color: #0a0a05;
      --surface: #11110a;
      --surface-variant: #1a1a0f;
      --border: #2a3a4a;
      --primary: #99f1f3; /* Cyan Admin Accent */
      --text-main: #ffffff;
      --text-muted: #a8a892;
      --danger: #ff5544;
      --success: #88d982;
      --success-bg: #005b14;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* --- Header --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 12px 24px;
      background: rgba(10, 10, 5, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      position: sticky;
      top: 0;
    }

    .brand {
      font-size: 24px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -1px;
      text-shadow: 0 0 10px rgba(153, 241, 243, 0.4);
    }
    .brand span {
      color: var(--primary);
    }

    .profile-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
    }

    /* --- Main Content --- */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      padding-bottom: 100px; /* Space for navbar */
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px 0;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 24px 0;
      line-height: 1.5;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(153, 241, 243, 0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* User List */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .user-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .user-card:active {
      transform: scale(0.98);
      background: var(--surface-variant);
    }

    .user-info h3 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }
    .user-info p {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-sm {
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(153, 241, 243, 0.1);
      color: var(--primary);
      border: 1px solid var(--primary);
      font-size: 12px;
      font-weight: 700;
    }

    /* --- Bottom Navigation --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: rgba(10, 10, 5, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 20px; /* Safe area inset */
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .nav-item.active .nav-icon {
      fill: rgba(153, 241, 243, 0.2);
    }

    .nav-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">FORGE <span>ADMIN</span></div>
    <div class="profile-avatar">A</div>
  </header>

  <main>
    <h1>Command Center</h1>
    <p class="subtitle">Verwalte Athleten und System-Ressourcen.</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">8,421</div>
        <div class="stat-label">Active Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">142</div>
        <div class="stat-label">New Today</div>
      </div>
    </div>

    <div class="section-title">Recent Registrations</div>

    <div class="user-card">
      <div class="user-info">
        <h3>biser.milenov@example.com</h3>
        <p>Joined 2 hours ago</p>
      </div>
      <div class="btn-sm">VIEW</div>
    </div>

    <div class="user-card">
      <div class="user-info">
        <h3>athlete_99@forge.io</h3>
        <p>Joined 5 hours ago</p>
      </div>
      <div class="btn-sm">VIEW</div>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="admin-app-dashboard.html" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="9" rx="1"></rect>
        <rect x="14" y="3" width="7" height="5" rx="1"></rect>
        <rect x="14" y="12" width="7" height="9" rx="1"></rect>
        <rect x="3" y="16" width="7" height="5" rx="1"></rect>
      </svg>
      <span class="nav-label">OVERVIEW</span>
    </a>
    <a href="admin-app-health.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </svg>
      <span class="nav-label">SYS HEALTH</span>
    </a>
  </nav>

</body>
</html>
