<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORGE Workout App - Prototype Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a05;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    .sidebar {
      width: 300px;
      background-color: #11110a;
      border-right: 1px solid #33331a;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      color: #ede900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-title {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .nav-btn {
      background-color: transparent;
      border: 1px solid #33331a;
      color: #ccc;
      padding: 12px;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .nav-btn:hover {
      background-color: #1a1a0f;
      color: #fff;
      border-color: #ede900;
      box-shadow: 0 0 10px rgba(237, 233, 0, 0.1);
    }

    .nav-btn.active {
      background-color: rgba(237, 233, 0, 0.1);
      color: #ede900;
      border-color: #ede900;
      box-shadow: 0 0 15px rgba(237, 233, 0, 0.2);
    }

    .preview-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a1a0f 0%, #0a0a05 100%);
    }

    /* iPhone Frame CSS */
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      background-color: #000;
      border-radius: 50px;
      box-shadow: 
        0 0 0 12px #222,
        0 0 0 14px #333,
        0 30px 40px rgba(0,0,0,0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Notch / Dynamic Island */
    .device::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      background-color: #000;
      border-radius: 20px;
      z-index: 10;
    }

    /* Screen Content */
    .screen {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #141408;
      border-radius: 40px;
    }

    /* Mobile scaling if screen is too small */
    @media (max-height: 900px) {
      .device {
        transform: scale(0.85);
      }
    }
    @media (max-height: 800px) {
      .device {
        transform: scale(0.75);
      }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">FORGE Protos</div>
    
    <div class="nav-group">
      <div class="nav-title">Workout App</div>
      <button class="nav-btn active" onclick="loadFrame('workout-app-dashboard.html', this)">Dashboard v1</button>
      <button class="nav-btn" onclick="loadFrame('workout-app-dashboard-generated.html', this)">Dashboard (Generated)</button>
      <button class="nav-btn" onclick="loadFrame('workout-app-health.html', this)">Health Stats</button>
    </div>

    <div class="nav-group" style="margin-top: 20px;">
      <div class="nav-title">Admin App</div>
      <button class="nav-btn" onclick="loadFrame('admin-app-dashboard.html', this)">Admin Dashboard</button>
      <button class="nav-btn" onclick="loadFrame('admin-app-health.html', this)">Admin Health</button>
    </div>
  </div>

  <div class="preview-container">
    <div class="device">
      <iframe src="workout-app-dashboard.html" class="screen" id="proto-frame" title="Prototype Preview"></iframe>
    </div>
  </div>

  <script>
    function loadFrame(url, btn) {
      document.getElementById('proto-frame').src = url;
      
      // Update active state
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
